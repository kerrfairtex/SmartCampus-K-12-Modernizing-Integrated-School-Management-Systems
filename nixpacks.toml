[phases.setup]
nixPkgs = ["php81", "php81Packages.composer", "php81Extensions.pdo_pgsql", "php81Extensions.gd"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = ["php artisan route:cache", "php artisan view:cache"]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
