name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (PHP ${{ matrix.php }} / Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        node: ['20']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: school_user
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: school_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, mbstring, zip, exif, pcntl, gd
          coverage: none

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Copy .env
        run: cp .env.example .env

      - name: Set test DB env
        run: |
          echo "DB_CONNECTION=pgsql"     >> .env
          echo "DB_HOST=127.0.0.1"       >> .env
          echo "DB_PORT=5432"            >> .env
          echo "DB_DATABASE=school_test" >> .env
          echo "DB_USERNAME=school_user" >> .env
          echo "DB_PASSWORD=secret"      >> .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run PHPUnit tests
        run: php artisan test --parallel
